<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f0" />
      <stop offset="100%" stop-color="#fceddb" />
    </linearGradient>
    <linearGradient id="gurGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#994711" />
      <stop offset="50%" stop-color="#733208" />
      <stop offset="100%" stop-color="#4e2004" />
    </linearGradient>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c66a38" />
      <stop offset="100%" stop-color="#8a3c14" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#733208" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#bgGrad)" rx="24" />
  
  <!-- Decorative Background Circles -->
  <circle cx="510" cy="90" r="140" fill="#f57c00" opacity="0.05" />
  <circle cx="80" cy="380" r="160" fill="#f57c00" opacity="0.04" />

  <!-- Earthen Clay Pot (Matir Handi) -->
  <g filter="url(#shadow)" transform="translate(140, 110)">
    <!-- Pot Body -->
    <ellipse cx="160" cy="220" rx="140" ry="24" fill="#6d2e0b" opacity="0.25" />
    <path d="M 60 170 Q 50 100 100 70 Q 160 55 220 70 Q 270 100 260 170 Q 250 220 160 225 Q 70 220 60 170 Z" fill="url(#potGrad)" />
    <!-- Pot Neck & Rim -->
    <ellipse cx="160" cy="65" rx="65" ry="16" fill="#733208" />
    <ellipse cx="160" cy="60" rx="60" ry="12" fill="#522204" />
    
    <!-- Rich Date Molasses overflowing / Dripping -->
    <path d="M 120 65 Q 160 85 200 65 Q 210 90 205 120 Q 195 140 185 110 Q 170 160 155 125 Q 140 175 125 115 Z" fill="url(#gurGrad)" />
    
    <!-- Patali Gur Blocks on side -->
    <polygon points="230,170 290,145 330,175 270,200" fill="#8c3e0e" />
    <polygon points="230,170 270,200 270,225 230,195" fill="#5c2607" />
    <polygon points="270,200 330,175 330,200 270,225" fill="#733208" />

    <polygon points="210,195 260,175 295,200 245,220" fill="#994711" />
    <polygon points="210,195 245,220 245,240 210,215" fill="#5c2607" />
    <polygon points="245,220 295,200 295,220 245,240" fill="#7a340a" />
  </g>

  <!-- Winter Snowflake & Palm Leaf Motifs -->
  <g transform="translate(480, 50)" fill="#f37820" opacity="0.7">
    <circle cx="20" cy="20" r="4" />
    <circle cx="45" cy="35" r="3" />
    <circle cx="10" cy="50" r="2.5" />
  </g>

  <!-- Badge on Bottom Left -->
  <g transform="translate(40, 360)">
    <rect width="180" height="48" rx="24" fill="#ffffff" filter="url(#shadow)" />
    <circle cx="28" cy="24" r="14" fill="#f37820" />
    <path d="M22 24 L27 28 L35 19" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="52" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#2d1506">১০০% আসল গুড়</text>
    <text x="52" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#8c6145">যশোর ও ফরিদপুরের রস</text>
  </g>

  <!-- Winter Seal Badge -->
  <g transform="translate(430, 340)">
    <circle cx="50" cy="50" r="45" fill="#f37820" />
    <circle cx="50" cy="50" r="40" fill="#ffffff" />
    <circle cx="50" cy="50" r="37" fill="#f37820" />
    <text x="50" y="44" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">শীতের স্পেশাল</text>
    <text x="50" y="60" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">WINTER</text>
  </g>
</svg>

