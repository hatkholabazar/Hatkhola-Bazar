<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="gheeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbf0" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <linearGradient id="gheeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4" />
    </linearGradient>
    <filter id="gheeShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#b45309" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#gheeBg)" rx="24" />

  <!-- Ambient Glow -->
  <circle cx="490" cy="100" r="140" fill="#f59e0b" opacity="0.08" />
  <circle cx="110" cy="350" r="160" fill="#f59e0b" opacity="0.06" />

  <!-- The Jar -->
  <g filter="url(#gheeShadow)" transform="translate(195, 60)">
    <!-- Base Shadow -->
    <ellipse cx="105" cy="335" rx="85" ry="16" fill="#78350f" opacity="0.22" />

    <!-- Jar Lid (Traditional Metal/Gold or Fabric Tie) -->
    <rect x="55" y="15" width="100" height="28" rx="6" fill="#b45309" />
    <rect x="50" y="38" width="110" height="8" rx="3" fill="#d97706" />
    <!-- Cloth tie cord -->
    <line x1="50" y1="42" x2="160" y2="42" stroke="#fef3c7" stroke-width="2" stroke-dasharray="4 2" />

    <!-- Glass Jar Outer -->
    <rect x="25" y="55" width="160" height="260" rx="28" fill="#fffbeb" stroke="#fef3c7" stroke-width="2" />

    <!-- Rich Granular Ghee Filling (Danadar texture) -->
    <rect x="33" y="90" width="144" height="215" rx="20" fill="url(#gheeBody)" />
    
    <!-- Granular Texture Particles (Danadar Grains) -->
    <g fill="#fef08a" opacity="0.85">
      <circle cx="55" cy="130" r="3" />
      <circle cx="70" cy="115" r="2.5" />
      <circle cx="120" cy="125" r="3.5" />
      <circle cx="145" cy="140" r="3" />
      <circle cx="65" cy="165" r="3" />
      <circle cx="95" cy="150" r="2.5" />
      <circle cx="140" cy="175" r="3.5" />
      <circle cx="85" cy="190" r="3" />
      <circle cx="120" cy="205" r="2.5" />
      <circle cx="55" cy="220" r="3.5" />
      <circle cx="150" cy="230" r="3" />
      <circle cx="90" cy="245" r="2.5" />
      <circle cx="130" cy="265" r="3" />
      <circle cx="70" cy="275" r="3" />
      <circle cx="110" cy="285" r="3.5" />
    </g>

    <!-- Glass Specular Highlight -->
    <rect x="38" y="70" width="16" height="235" rx="8" fill="url(#glassReflection)" />

    <!-- Premium Front Label -->
    <rect x="45" y="140" width="120" height="115" rx="12" fill="#ffffff" filter="url(#gheeShadow)" />
    <rect x="49" y="144" width="112" height="107" rx="9" fill="#fffdfa" stroke="#d97706" stroke-width="1.2" />

    <!-- Label Contents -->
    <circle cx="105" cy="170" r="14" fill="#f37820" />
    <!-- Golden Cow Horns / Lotus Motif -->
    <path d="M 98 174 Q 105 163 112 174 Q 105 170 98 174 Z" fill="#ffffff" />
    <circle cx="105" cy="167" r="2.5" fill="#ffffff" />

    <text x="105" y="198" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#78350f" text-anchor="middle">DANADAR GHEE</text>
    <text x="105" y="211" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#b45309" text-anchor="middle">দানাদার ঘি</text>
    <text x="105" y="226" font-family="system-ui, sans-serif" font-size="7.5" font-weight="700" fill="#d97706" text-anchor="middle">100% PURE COW MILK</text>
    <text x="105" y="238" font-family="system-ui, sans-serif" font-size="7" font-weight="600" fill="#78350f" text-anchor="middle">TRADITIONAL BATHER</text>
  </g>

  <!-- Aroma Waves on Top -->
  <g stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M 285 45 Q 275 28 290 12" />
    <path d="M 305 45 Q 315 28 300 12" />
    <path d="M 325 45 Q 315 28 330 12" />
  </g>

  <!-- Left Trust Badge -->
  <g transform="translate(40, 360)">
    <rect width="180" height="48" rx="24" fill="#ffffff" filter="url(#gheeShadow)" />
    <circle cx="28" cy="24" r="14" fill="#f59e0b" />
    <path d="M22 24 L27 28 L35 19" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="52" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#78350f">100% Pure Ghee</text>
    <text x="52" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#92400e">Traditional Cow Milk</text>
  </g>

  <!-- Top Right Best Seller Seal -->
  <g transform="translate(435, 45)">
    <circle cx="45" cy="45" r="40" fill="#f37820" />
    <circle cx="45" cy="45" r="35" fill="#ffffff" />
    <circle cx="45" cy="45" r="32" fill="#fef3c7" />
    <text x="45" y="42" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#b45309" text-anchor="middle">BEST</text>
    <text x="45" y="55" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#78350f" text-anchor="middle">SELLER</text>
  </g>
</svg>

